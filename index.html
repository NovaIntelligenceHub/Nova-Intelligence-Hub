<script>
const pv = [
["PV Fundamentals","Definition and history; objectives and scope; role of the PV professional; global PV system; benefit-risk balance","Pharmacovigilance is the science and activities related to detecting, assessing, understanding, and preventing adverse effects or other medicine-related problems.","A company receives a report that a patient experienced a new symptom after taking a medicine. The safety team records and assesses the report to understand whether it may be related to the medicine.","What is the main purpose of pharmacovigilance?","To monitor and help understand medicine safety"],
["Drug Safety Basics","Adverse drug reaction (ADR); adverse event (AE); adverse drug event (ADE); side effect; medication error; overdose; misuse; abuse; lack of efficacy","Drug-safety terms describe different types of events associated with medicine use. An adverse event is an unwanted medical occurrence after treatment; it does not automatically prove the medicine caused it.","A patient develops a headache after starting a medicine. It is initially an adverse event. Further medical assessment is needed before deciding whether it is an ADR.","Does an adverse event automatically prove causality?","No. A relationship with the medicine must be assessed"],
["ICSR Fundamentals","Individual Case Safety Report; four minimum criteria; report sources; valid and invalid cases; identifiable patient, reporter, suspect product and reaction","An ICSR is a structured report about one or more suspected adverse reactions in an individual patient. The four minimum elements are an identifiable patient, identifiable reporter, suspect medicinal product, and suspected reaction.","A report with a patient, reporter, named medicine, and described reaction contains the four basic elements needed to consider it a valid ICSR.","Name the four minimum ICSR elements.","Patient, reporter, suspect product, and reaction"],
["ICSR Case Processing","Intake; triage; validity; duplicate search; data entry; coding; medical review; quality check; submission; follow-up","Case processing is a controlled workflow that turns incoming safety information into a complete, consistent, medically reviewable safety case. Each step must be documented and performed according to applicable procedures.","A safety associate receives a consumer report, checks the four minimum criteria, searches for duplicates, enters available details, and routes the case for review.","Why is duplicate checking important?","To avoid counting the same safety case more than once"],
["Medical Assessment","Seriousness criteria; severity; expectedness; causality; listedness; outcome; dechallenge and rechallenge concepts","Medical assessment evaluates the clinical details of a safety report. Seriousness is based on regulatory outcome criteria, while severity describes the intensity of the event; these terms are not interchangeable.","A mild symptom can still meet a seriousness criterion if it results in hospitalization. The clinical outcome, not just intensity, determines seriousness.","Are seriousness and severity identical?","No. Seriousness uses regulatory outcome criteria; severity describes intensity"],
["MedDRA","Terminology purpose; hierarchy; SOC; HLGT; HLT; PT; LLT; coding conventions; version control","MedDRA is a standardized medical terminology used to code medical information consistently. Its hierarchy runs from Lowest Level Term (LLT) through Preferred Term (PT), High Level Term (HLT), High Level Group Term (HLGT), to System Organ Class (SOC).","A reporter describes 'feeling sick'. A trained coder selects the most appropriate MedDRA term based on the reported concept and coding conventions.","Which MedDRA level is directly above PT?","HLT — High Level Term"],
["Narrative Writing","Narrative purpose; chronology; patient details; medical history; product details; event details; treatment; outcome; source attribution","A case narrative is a concise, chronological clinical summary of the information in a safety case. It should be factual, clear, medically understandable, and should not add unsupported assumptions.","A narrative summarizes when the patient began treatment, when the event occurred, relevant medical history, action taken with the medicine, treatment, and outcome.","Should a case narrative add facts that were not reported?","No. It must accurately reflect the available source information"],
["Regulatory Reporting","Expedited reporting concepts; reportability assessment; clock start; submission destinations; regional differences; ICH E2A/E2D concepts","Regulatory reporting communicates qualifying safety information to the appropriate authority within applicable regional timelines. The reportability decision and clock start must follow current regulations and company procedures.","A safety team identifies a potentially reportable serious case. It documents the relevant dates and applies the applicable regional rule and current procedure to determine the deadline.","Are reporting timelines identical in every country?","No. Requirements vary by region and report type"],
["Aggregate Reports","PSUR; PBRER; DSUR; PADER; periodic review; benefit-risk evaluation; data lock point","Aggregate safety reports evaluate safety information across many cases and other data over a defined period. They support an overall benefit-risk assessment rather than describing only one patient.","A periodic report reviews accumulated adverse reaction data, exposure estimates, literature, and new safety findings to evaluate whether the product's benefit-risk balance remains favorable.","What is the purpose of an aggregate safety report?","To evaluate cumulative safety information and benefit-risk"],
["Signal Management","Signal definition; detection; validation; prioritization; assessment; recommendation; tracking; signal closure","Signal management is a structured process for identifying and evaluating information that may suggest a new potentially causal association or a new aspect of a known association between a medicine and an event.","A pattern of similar reports is noticed. The team checks data quality and supporting evidence before deciding whether a signal is valid and needs further assessment.","What usually follows signal detection?","Signal validation"],
["Risk Management","Safety concerns; risk management plan; risk minimization; routine and additional measures; effectiveness evaluation","Risk management identifies important safety concerns and describes how they will be monitored and minimized. Measures should be proportionate to the evidence and reviewed for effectiveness.","A medicine has an identified risk that requires clear patient information and monitoring advice. The risk-management approach documents the concern and planned measures.","What is the goal of risk minimization?","To reduce the likelihood or impact of important risks"],
["PV Quality System","SOPs; training; deviations; CAPA; quality metrics; vendor oversight; documentation; compliance","A PV quality system provides documented processes, trained personnel, oversight, and checks so safety activities are performed consistently and compliantly.","If a case-processing step is missed, the organization documents the deviation, investigates its cause, and defines corrective and preventive actions where appropriate.","What does CAPA stand for?","Corrective and Preventive Action"],
["Literature Monitoring","Search strategy; scientific databases; screening; case identification; duplicate checks; documentation; publication follow-up","Literature monitoring identifies relevant published safety information. Search strategies and screening decisions should be documented so the process is reproducible and auditable.","A scheduled literature search finds a published case report. The team screens it against product and case criteria and processes any qualifying safety information under procedure.","Why document literature search strategies?","To make searches traceable and reproducible"],
["Clinical Trial Safety","AE; SAE; SUSAR; investigator responsibilities; sponsor responsibilities; safety oversight; unblinding concepts","Clinical-trial safety monitoring collects and evaluates adverse events during research. Investigators and sponsors have defined responsibilities, and applicable reporting rules depend on the event and jurisdiction.","A trial participant experiences an event that meets a serious criterion. The investigator records and reports it to the sponsor according to the protocol and applicable requirements.","What does SAE mean?","Serious Adverse Event"],
["Special PV Areas","Pregnancy exposure; pediatrics; geriatrics; vaccines; biologics; medication errors; overdose; product quality complaints","Some populations and product types need additional safety considerations because exposure, response, or available evidence may differ. Reports should be handled using relevant guidance and specialized procedures.","A pregnancy exposure report may need follow-up information about timing, maternal health, and pregnancy outcome, handled sensitively and according to the applicable process.","Why may pregnancy exposure reports need follow-up?","To collect relevant exposure and outcome information"],
["PV Audits and Inspections","Audit scope; inspection readiness; evidence; findings; responses; CAPA; records; governance","Audits and inspections assess whether PV systems and activities meet applicable requirements and documented procedures. Good readiness depends on accurate records, trained staff, and traceable processes.","An auditor samples cases and checks whether key processing steps, review evidence, and submission records are complete and traceable.","What supports inspection readiness?","Accurate, complete, retrievable records and trained personnel"],
["PV Systems and Databases","Safety database concepts; workflows; user roles; audit trails; data quality; access controls; reconciliation","Safety databases support structured storage and processing of safety information. They need controlled access, traceable changes, reliable workflows, and appropriate data-quality checks.","A case is entered into a validated company safety system. Authorized reviewers can see the case history and documented changes through the audit trail.","Why are audit trails important?","They record who changed data, what changed, and when"],
["Advanced PV","Pharmacoepidemiology; real-world data; real-world evidence; benefit-risk; automation; AI support; limitations and governance","Advanced PV combines safety reports with other evidence sources and analytical methods. Real-world evidence can complement spontaneous reports, but data quality, bias, confounding, and governance must be considered.","An analyst studies a large healthcare dataset to explore a possible safety pattern. The result is treated as evidence for assessment, not automatic proof of causation.","Does an AI-generated safety signal prove causality?","No. Expert assessment and supporting evidence are still required"]
];
const ra = [
["RA Fundamentals","Definition; scope; product lifecycle; regulatory strategy; RA responsibilities; cross-functional collaboration","Regulatory Affairs ensures that medicines and related products meet applicable regulatory requirements throughout development, approval, and post-approval life. RA connects scientific, quality, clinical, and regulatory information.","An RA professional coordinates quality, nonclinical, and clinical documents so a submission is complete and follows the relevant authority's requirements.","What is a central responsibility of RA?","Ensuring regulatory requirements are understood and submissions are managed"],
["Regulatory Authorities","CDSCO; DCGI; US FDA; EMA; MHRA; TGA; Health Canada; WHO; national authority roles","Regulatory authorities oversee medicines within their jurisdictions. Their responsibilities and procedures differ, so regulatory professionals must consult the current official requirements for the target market.","A company planning a submission for India checks the current CDSCO requirements rather than assuming the US or European pathway applies.","Why identify the target market authority first?","Because requirements and procedures differ by jurisdiction"],
["Drug Development","Discovery; preclinical studies; clinical phases; manufacturing development; application; approval; lifecycle","Drug development moves from research and nonclinical evaluation through clinical investigation and regulatory review. The exact pathway depends on product type and jurisdiction.","A new medicine candidate is evaluated before human studies, then studied in clinical trials, and later submitted with supporting quality, safety, and efficacy evidence.","What generally comes before clinical trials?","Nonclinical evaluation and required authorizations"],
["Regulatory Documentation","Document types; SOPs; specifications; protocols; reports; controlled copies; versioning; ALCOA+","Regulatory documentation must be accurate, complete, controlled, traceable, and consistent. Data integrity principles support confidence in the information submitted to authorities.","A revised specification is reviewed, approved, version-controlled, and distributed so teams use the correct effective document.","Why is version control important?","To ensure people use the current approved document"],
["CTD Structure","Module 1 regional information; Module 2 summaries; Module 3 quality; Module 4 nonclinical; Module 5 clinical","The Common Technical Document organizes an application into five modules. Module 1 is region-specific; Modules 2–5 follow the harmonized CTD structure.","A reviewer looking for stability and manufacturing information will generally find quality content in Module 3.","Which CTD module contains quality information?","Module 3"],
["eCTD","Electronic CTD; backbone; sequences; lifecycle operations; metadata; technical validation; publishing","eCTD is an electronic format for regulatory submissions. It organizes documents and metadata so authorities can navigate and manage submission sequences and lifecycle changes.","A company submits an initial electronic dossier and later sends a sequence containing updated documents using the applicable lifecycle operation.","What does eCTD support?","Structured electronic submission and lifecycle management"],
["CMC","Chemistry; manufacturing; controls; composition; process; specifications; analytical methods; stability; packaging","CMC information describes what a product is made of, how it is manufactured, and how quality is controlled. It helps demonstrate consistent product quality.","A dossier describes the formulation, manufacturing process, analytical tests, acceptance criteria, and stability data for a medicine.","What does CMC stand for?","Chemistry, Manufacturing, and Controls"],
["DMF and ASMF","Drug Master File; Active Substance Master File; applicant references; open and restricted parts; holder responsibilities","DMFs and ASMFs provide detailed information about materials or active substances to authorities, often allowing confidential manufacturing information to be submitted separately from an applicant's dossier.","An applicant references an appropriate master file while the file holder supplies confidential details directly to the authority under the applicable procedure.","Why are master files useful?","They can protect confidential technical information while supporting a submission"],
["ICH Guidelines","Quality Q; Safety S; Efficacy E; Multidisciplinary M; harmonization; guideline lifecycle","ICH develops harmonized technical guidelines for pharmaceutical development and registration. The Q, S, E, and M families cover different technical and cross-functional areas.","A stability program may refer to relevant ICH quality guidance, while clinical safety topics may use relevant efficacy or safety guidance.","Which ICH family covers quality?","The Q family"],
["Indian Regulatory Framework","Drugs and Cosmetics Act and Rules; CDSCO; DCGI; state licensing authorities; new drugs; clinical trials; import and manufacture","India's regulatory framework includes central and state responsibilities. Requirements depend on the activity and product, so users should check current laws, rules, and CDSCO notices.","A company planning a regulated activity in India identifies whether the relevant approval or license is handled centrally or by a state authority.","Should an applicant rely on an old checklist alone?","No. Verify current official requirements"],
["US FDA Pathways","IND; NDA; ANDA; BLA; 505(b)(2); application purpose; review pathway","The US FDA uses different application pathways depending on the product and development context. Each pathway has specific requirements and should be selected based on the product and applicable law.","A generic drug application may use the ANDA pathway when the product and legal criteria fit that route.","What is an ANDA generally used for?","A qualifying abbreviated application for a generic drug"],
["European Regulatory Pathways","EMA role; centralized procedure; decentralized procedure; mutual recognition; national procedure; marketing authorization","European medicines authorization can follow different procedures depending on product type and regulatory context. The EMA and national competent authorities have distinct roles.","A company assesses whether a product falls within the scope of the centralized procedure or whether another European route is appropriate.","Are all medicines authorized through one European procedure?","No. Several authorization procedures exist"],
["GxP and GMP","GMP; GLP; GCP; GDP; quality systems; personnel; premises; records; validation; deviations","GxP describes good-practice standards across regulated activities. GMP focuses on manufacturing quality; GLP on nonclinical laboratory studies; GCP on clinical trials; GDP on distribution.","A manufacturing site follows GMP controls to help ensure medicines are consistently produced and controlled to appropriate quality standards.","Which GxP area focuses on clinical trials?","GCP"],
["Submission Management","Regulatory plan; dossier collection; QC; publishing; validation; dispatch; authority queries; tracking","Submission management coordinates documents, reviews, formatting, publishing, and delivery to an authority. A traceable plan helps teams meet milestones and resolve deficiencies.","Before submission, a team checks document completeness, confirms versions, performs technical checks, and tracks the final dispatch.","Why perform a submission quality check?","To identify missing, inconsistent, or technically incorrect content before filing"],
["Lifecycle Management","Variations; supplements; amendments; renewals; commitments; post-approval changes; change control","Regulatory responsibilities continue after approval. Changes to manufacturing, labeling, safety information, or other approved details may require notification or approval under regional rules.","A manufacturing-site change is assessed for regulatory impact before implementation, using the applicable change-control and variation requirements.","Why assess a change before implementation?","It may require regulatory notification or approval"],
["Labeling","Prescribing information; SmPC; PIL; package insert; core safety information; local requirements; artwork review","Product labeling communicates approved information about a medicine, including use, warnings, dosage, and safety. Content and format requirements vary by market.","A labeling team checks that a proposed update is consistent with approved product information and applicable local requirements.","Why is labeling important?","It communicates approved and safety-critical product information"],
["Regulatory Intelligence","Official sources; guideline monitoring; change assessment; impact analysis; tracking; communication","Regulatory intelligence is the systematic monitoring and assessment of regulatory changes that may affect products, submissions, or business processes.","A regulatory team reviews an authority's new guidance, records the change, assesses affected products, and communicates required actions.","What is the purpose of impact assessment?","To determine which products or processes may be affected"],
["Gap Analysis and Compliance","Requirement mapping; current-state review; gap identification; risk ranking; action plan; evidence","Gap analysis compares current documentation or processes with defined requirements. It identifies missing or inadequate elements and helps prioritize corrective actions.","A team compares its dossier checklist with the current authority guidance and records missing evidence for follow-up.","What is the first goal of a gap analysis?","Identify differences between current status and requirements"],
["Audits and Inspections","Readiness; document retrieval; responses; observations; CAPA; commitments; inspection conduct","Regulatory audits and inspections evaluate whether systems and records meet requirements. Responses should be factual, evidence-based, timely, and controlled.","When an inspector requests a controlled record, the team retrieves the approved version and records the request and response through its process.","What should an inspection response be based on?","Accurate evidence and documented facts"],
["Advanced RA","Regulatory strategy; reliance; lifecycle planning; digital health; AI support; automation; global submissions","Advanced RA combines strategic planning, global coordination, digital submission tools, and regulatory intelligence. Technology can support review, but accountable professionals must verify outputs.","A team uses software to flag missing dossier sections, then qualified reviewers verify the findings against current guidance.","Can automated gap analysis replace expert regulatory review?","No. It can support, but not replace, qualified review"]
];

const glossary = [
["ADR","Adverse Drug Reaction","A harmful and unintended response to a medicine where a causal relationship is at least a reasonable possibility."],
["AE","Adverse Event","An unwanted medical occurrence after a medicine is used; causality is not necessarily established."],
["ICSR","Individual Case Safety Report","A structured report describing a suspected adverse reaction in an individual patient."],
["MedDRA","Medical Dictionary for Regulatory Activities","A standardized medical terminology used for regulatory safety information."],
["SOC","System Organ Class","The highest level in the MedDRA hierarchy."],
["PT","Preferred Term","A distinct descriptor for a medical concept in MedDRA."],
["SAE","Serious Adverse Event","An adverse event meeting one or more defined seriousness criteria."],
["SUSAR","Suspected Unexpected Serious Adverse Reaction","A suspected reaction that is serious and unexpected under applicable clinical-trial rules."],
["PSUR","Periodic Safety Update Report","A periodic report evaluating a medicine's safety profile."],
["PBRER","Periodic Benefit-Risk Evaluation Report","A structured evaluation of cumulative benefit-risk information."],
["DSUR","Development Safety Update Report","An annual safety report for a drug under development."],
["RMP","Risk Management Plan","A document describing safety concerns and plans to monitor and minimize risks."],
["CAPA","Corrective and Preventive Action","Actions intended to correct a problem and reduce recurrence."],
["CTD","Common Technical Document","A harmonized structure for organizing regulatory application information."],
["eCTD","Electronic Common Technical Document","An electronic format for regulatory submissions."],
["CMC","Chemistry, Manufacturing, and Controls","Information describing product composition, manufacturing, and quality controls."],
["DMF","Drug Master File","A submission containing detailed information, often including confidential technical details."],
["ASMF","Active Substance Master File","A European procedure for submitting active-substance information with confidential sections."],
["GMP","Good Manufacturing Practice","Standards intended to help ensure medicines are consistently produced and controlled."],
["GCP","Good Clinical Practice","An ethical and scientific quality standard for clinical trials."],
["GLP","Good Laboratory Practice","A quality system for certain nonclinical health and environmental safety studies."],
["GDP","Good Distribution Practice","Standards supporting appropriate storage and distribution of medicines."],
["CDSCO","Central Drugs Standard Control Organization","India's national regulatory authority for drugs and certain related products."],
["FDA","Food and Drug Administration","The US federal agency responsible for, among other areas, regulating medicines."],
["EMA","European Medicines Agency","An EU agency involved in scientific evaluation and supervision of medicines."],
["ICH","International Council for Harmonisation","An organization developing harmonized technical guidelines for medicines."],
["NDA","New Drug Application","A US FDA application pathway for approval of a new drug."],
["ANDA","Abbreviated New Drug Application","A US FDA pathway generally used for qualifying generic drug applications."],
["IND","Investigational New Drug","A US submission seeking authorization to begin specified clinical investigations."],
["BLA","Biologics License Application","A US application pathway for certain biological products."]
];

let completed = JSON.parse(localStorage.getItem("novaCompleted")||"[]");
let currentCourse="pv", currentModule=null, activePage="home";
function startApp(){document.getElementById("welcome").classList.add("hidden");document.getElementById("app").classList.remove("hidden");renderHome()}
function save(){localStorage.setItem("novaCompleted",JSON.stringify(completed))}
function showPage(page,btn){activePage=page;document.querySelectorAll(".navbtn").forEach(x=>x.classList.remove("active"));if(btn)btn.classList.add("active");const titles={home:"Learning Dashboard",pv:"Pharmacovigilance Course",ra:"Regulatory Affairs Course",tutor:"Nova AI Tutor",practice:"Practice Laboratory",interview:"Interview Preparation",glossary:"Pharmaceutical Glossary",progress:"My Learning Progress"};document.getElementById("pageTitle").textContent=titles[page]||"Nova AI";({home:renderHome,pv:()=>renderCourse("pv"),ra:()=>renderCourse("ra"),tutor:renderTutor,practice:renderPractice,interview:renderInterview,glossary:renderGlossary,progress:renderProgress}[page])()}
function allMods(){return [...pv.map((m,i)=>({...m,id:"pv"+i,course:"pv",index:i})),...ra.map((m,i)=>({...m,id:"ra"+i,course:"ra",index:i}))]}
function renderHome(){let pvDone=completed.filter(x=>x.startsWith("pv")).length,raDone=completed.filter(x=>x.startsWith("ra")).length;document.getElementById("view").innerHTML=`
<div class="hero"><div><h1>Welcome to your learning space.</h1><p>Build practical knowledge in Pharmacovigilance and Regulatory Affairs, one topic at a time. Learn concepts, explore examples, and test your understanding.</p></div><div class="hero-mark">✦</div></div>
<div class="stats"><div class="stat"><b>${pvDone+raDone}/38</b><small>Lessons completed</small></div><div class="stat"><b>${Math.round((pvDone+raDone)/38*100)}%</b><small>Overall course progress</small></div><div class="stat"><b>2</b><small>Complete learning tracks</small></div></div>
<div class="sectionhead"><div><h2>Choose your learning path</h2><p>Start from the fundamentals and progress to advanced concepts.</p></div></div>
<div class="coursegrid">
<div class="card course"><div class="icon">✚</div><h3>Pharmacovigilance</h3><p>Drug safety, ICSR processing, MedDRA, signal management, risk management and advanced PV.</p><div class="progress"><i style="width:${pvDone/pv.length*100}%"></i></div><div class="coursefoot"><span>${pv.length} modules</span><span>${pvDone} completed</span></div><button class="primary" style="margin-top:16px" onclick="showPage('pv',document.querySelector('[data-page=pv]'))">Explore PV →</button></div>
<div class="card course"><div class="icon">▤</div><h3>Regulatory Affairs</h3><p>Regulatory authorities, CTD/eCTD, CMC, ICH, global pathways and lifecycle management.</p><div class="progress"><i style="width:${raDone/ra.length*100}%"></i></div><div class="coursefoot"><span>${ra.length} modules</span><span>${raDone} completed</span></div><button class="primary" style="margin-top:16px" onclick="showPage('ra',document.querySelector('[data-page=ra]'))">Explore RA →</button></div></div>
<div class="sectionhead"><div><h2>Learning tools</h2><p>Practice and strengthen your understanding.</p></div></div>
<div class="grid3"><div class="card feature"><div>✧</div><h3>Nova Tutor</h3><p>Ask learning questions and get simple explanations from the built-in learning guide.</p></div><div class="card feature"><div>⚗</div><h3>Practice Lab</h3><p>Try ICSR, CTD and regulatory document exercises.</p></div><div class="card feature"><div>▣</div><h3>Interview Prep</h3><p>Revise common fresher-level PV and RA interview questions.</p></div></div>
<div class="footer">Educational learning prototype. Verify current requirements using official regulatory sources.</div>`}
function renderCourse(course){currentCourse=course;currentModule=null;const data=course==="pv"?pv:ra;const title=course==="pv"?"Pharmacovigilance":"Regulatory Affairs";document.getElementById("view").innerHTML=`
<button class="back" onclick="showPage('home',document.querySelector('[data-page=home]'))">← Dashboard</button>
<div class="sectionhead"><div><h2>${title} – Complete Course</h2><p>${data.length} structured modules · Beginner to advanced</p></div></div>
<div class="toolbar"><input class="search" id="moduleSearch" placeholder="Search modules or topics..." oninput="filterModules()"><select class="filter" id="moduleStatus" onchange="filterModules()"><option value="all">All modules</option><option value="done">Completed</option><option value="todo">Not completed</option></select></div>
<div class="modulegrid" id="moduleGrid">${data.map((m,i)=>moduleCard(m,course,i)).join("")}</div>`}
function moduleCard(m,c,i){let id=c+i;return `<button class="module" data-search="${(m[0]+" "+m[1]).toLowerCase()}" data-done="${completed.includes(id)}" onclick="openLesson('${c}',${i})"><div class="num">MODULE ${String(i+1).padStart(2,"0")} ${completed.includes(id)?" · ✓ COMPLETED":""}</div><h3>${m[0]}</h3><p>${m[1].split(";").slice(0,4).join(" · ")}</p></button>`}
function filterModules(){let q=document.getElementById("moduleSearch").value.toLowerCase(),s=document.getElementById("moduleStatus").value;document.querySelectorAll("#moduleGrid .module").forEach(el=>{el.classList.toggle("hidden",!(el.dataset.search.includes(q)&&(s==="all"||(s==="done"&&el.dataset.done==="true")||(s==="todo"&&el.dataset.done==="false"))))})}
function openLesson(course,i){currentCourse=course;currentModule=i;let m=(course==="pv"?pv:ra)[i],id=course+i;document.getElementById("pageTitle").textContent=m[0];let isDone=completed.includes(id);document.getElementById("view").innerHTML=`
<button class="back" onclick="renderCourse('${course}')">← Back to ${course.toUpperCase()} modules</button>
<article class="lesson"><div class="pill">${course==="pv"?"PHARMACOVIGILANCE":"REGULATORY AFFAIRS"} · MODULE ${i+1}</div><h2>${m[0]}</h2><p class="lead">A structured lesson designed to make the concept easier to understand.</p>
<h3>1. Simple explanation</h3><p>${m[2]}</p>
<h3>2. Topics covered</h3><ul>${m[1].split(";").map(x=>`<li>${x.trim()}</li>`).join("")}</ul>
<h3>3. Practical learning example</h3><div class="example">${m[3]}<br><small><b>Learning note:</b> This is a fictional educational example, not a real patient case or regulatory submission.</small></div>
<h3>4. How to remember this topic</h3><p>First understand the purpose, then learn the key terms, follow the process in order, and finally apply the concept to the example. Keep a short note of the important points and review it before interviews.</p>
<h3>5. Knowledge check</h3><div class="qbox"><b>${m[4]}</b><div id="quizOptions"><button class="option" onclick="checkAnswer(this,true,'${encodeURIComponent(m[5])}')">Show the model answer</button><button class="option" onclick="checkAnswer(this,false,'${encodeURIComponent(m[5])}')">Try answering in my own words</button></div><div id="quizFeedback"></div></div>
<div class="note">Professional reminder: use current official guidance, approved procedures, and qualified review for real workplace decisions. This lesson is for education and interview preparation.</div>
<button class="primary" style="margin-top:20px" onclick="markComplete('${id}')">${isDone?"✓ Lesson completed":"Mark lesson as completed"}</button>
</article>`}
function checkAnswer(btn,show,ans){let a=decodeURIComponent(ans);document.getElementById("quizFeedback").innerHTML=`<div class="feedback ${show?"good":"bad"}"><b>Model answer:</b> ${a}<br>${show?"Review the explanation above and try to explain it in your own words.":"Compare your own answer with this key point, then revise the lesson."}</div>`}
function markComplete(id){if(!completed.includes(id))completed.push(id);save();openLesson(currentCourse,currentModule)}
function renderTutor(){document.getElementById("view").innerHTML=`<div class="sectionhead"><div><h2>Ask Nova</h2><p>Try a question about PV or RA. This offline demo uses a curated learning guide.</p></div></div><div class="panel"><div class="chatlog" id="chatlog"><div class="bubble bot"><b>Nova:</b> Hello! Ask me about ICSR, ADR, MedDRA, CTD, eCTD, ICH, CMC, GMP, or another PV/RA topic. I'll help with a beginner-friendly explanation.</div></div><div class="chatrow"><input id="chatInput" placeholder="Example: Explain the four ICSR criteria..." onkeydown="if(event.key==='Enter')askNova()"><button onclick="askNova()">Ask</button></div><p class="subtle">Prototype limitation: this tutor is not connected to a live AI model. It matches your question to built-in learning content.</p></div>`}
function askNova(){let inp=document.getElementById("chatInput"),q=inp.value.trim();if(!q)return;let log=document.getElementById("chatlog");log.innerHTML+=`<div class="bubble user">${escapeHTML(q)}</div>`;let terms=q.toLowerCase(),found=allMods().find(m=>(m[0]+" "+m[1]+" "+m[2]).toLowerCase().split(/[ ;,]+/).some(w=>w.length>3&&terms.includes(w)));let answer=found?`<b>${found[0]}</b><br>${found[2]}<br><br><b>Example:</b> ${found[3]}<br><br><b>Check your understanding:</b> ${found[4]}<br><b>Model answer:</b> ${found[5]}`:`I can help with PV and RA learning topics such as ADR, ICSR, case processing, MedDRA, signal management, CTD, eCTD, CMC, ICH and GMP. Try asking a more specific question, such as “What are the four minimum ICSR criteria?”`;log.innerHTML+=`<div class="bubble bot"><b>Nova:</b> ${answer}</div>`;inp.value="";log.scrollTop=log.scrollHeight}
function escapeHTML(s){return s.replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function renderPractice(){document.getElementById("view").innerHTML=`<div class="sectionhead"><div><h2>Practice Laboratory</h2><p>Short educational exercises to connect concepts with practical workflows.</p></div></div><div class="coursegrid"><div class="card feature"><h3>ICSR minimum criteria checker</h3><p>Learn the four basic elements used to assess whether a report contains the minimum information for a valid ICSR.</p><button class="primary" onclick="practiceICSR()">Start exercise</button></div><div class="card feature"><h3>CTD module guide</h3><p>Match common dossier content to the appropriate CTD module.</p><button class="primary" onclick="practiceCTD()">Start exercise</button></div><div class="card feature"><h3>Regulatory gap review</h3><p>Practice comparing a fictional checklist with a stated requirement.</p><button class="primary" onclick="practiceGap()">Start exercise</button></div></div><div id="practiceResult"></div><div class="note">Exercises are simplified learning activities. They do not validate actual cases, dossiers, or regulatory submissions.</div>`}
function practiceICSR(){document.getElementById("practiceResult").innerHTML=`<div class="lesson"><h3>ICSR minimum criteria</h3><p>Select the four elements required for a valid ICSR.</p>${["Identifiable patient","Identifiable reporter","Suspect medicinal product","Suspected reaction","Batch release certificate","Marketing authorization number"].map((x,i)=>`<label style="display:block;padding:7px"><input type="checkbox" class="icsr" value="${i<4?1:0}"> ${x}</label>`).join("")}<button class="primary" onclick="scoreICSR()">Check answer</button><div id="practiceFeedback"></div></div>`}
function scoreICSR(){let xs=[...document.querySelectorAll(".icsr")],score=xs.filter(x=>x.checked&&x.value==="1").length,wrong=xs.filter(x=>x.checked&&x.value==="0").length;document.getElementById("practiceFeedback").innerHTML=`<div class="feedback ${score===4&&wrong===0?"good":"bad"}">You selected ${score} of the four correct elements${wrong?` and ${wrong} extra option(s)`:""}. The four minimum elements are patient, reporter, suspect product, and suspected reaction.</div>`}
function practiceCTD(){document.getElementById("practiceResult").innerHTML=`<div class="lesson"><h3>CTD module matching</h3><p>Where is the quality information generally placed?</p><button class="option" onclick="ctdAnswer(false)">Module 2</button><button class="option" onclick="ctdAnswer(true)">Module 3</button><button class="option" onclick="ctdAnswer(false)">Module 5</button><div id="practiceFeedback"></div></div>`}
function ctdAnswer(ok){document.getElementById("practiceFeedback").innerHTML=`<div class="feedback ${ok?"good":"bad"}">${ok?"Correct. Module 3 contains quality information.":"Not quite. The correct answer is Module 3, which contains quality information."}</div>`}
function practiceGap(){document.getElementById("practiceResult").innerHTML=`<div class="lesson"><h3>Fictional gap-review exercise</h3><p><b>Requirement:</b> The training checklist requires a current, approved SOP version.</p><p><b>Current evidence:</b> The team has an SOP, but its review date has passed.</p><p>What should the reviewer record?</p><button class="option" onclick="gapAnswer(false)">No gap because an SOP exists</button><button class="option" onclick="gapAnswer(true)">Potential gap requiring assessment and documented follow-up</button><div id="practiceFeedback"></div></div>`}
function gapAnswer(ok){document.getElementById("practiceFeedback").innerHTML=`<div class="feedback ${ok?"good":"bad"}">${ok?"Correct. Compare evidence with the stated requirement, document the gap, assess impact, and track follow-up.":"The existence of a document alone does not show that it meets the stated requirement."}</div>`}
function renderInterview(){document.getElementById("view").innerHTML=`<div class="sectionhead"><div><h2>Interview Preparation</h2><p>Practice explaining core concepts clearly and confidently.</p></div></div><div class="coursegrid"><div class="card course"><h3>PV fresher questions</h3>${["What is pharmacovigilance?","What are the four minimum ICSR criteria?","What is the difference between AE and ADR?","What is MedDRA?","What is a serious adverse event?"].map((x,i)=>`<details style="padding:9px 0;border-bottom:1px solid var(--line)"><summary>${x}</summary><p>${["Pharmacovigilance is the science and activities related to detecting, assessing, understanding and preventing adverse effects or other medicine-related problems.","An identifiable patient, identifiable reporter, suspect medicinal product and suspected reaction.","An AE is an unwanted medical occurrence after medicine use; an ADR is a harmful and unintended response where a causal relationship is at least a reasonable possibility.","MedDRA is a standardized medical terminology used for regulatory safety information.","An SAE is an adverse event meeting one or more defined seriousness criteria."][i]}</p></details>`).join("")}</div><div class="card course"><h3>RA fresher questions</h3>${["What is Regulatory Affairs?","What are the five CTD modules?","What is the difference between CTD and eCTD?","What is CMC?","What are ICH guidelines?"].map((x,i)=>`<details style="padding:9px 0;border-bottom:1px solid var(--line)"><summary>${x}</summary><p>${["Regulatory Affairs ensures that medicines meet applicable regulatory requirements through development, approval and post-approval lifecycle.","Module 1 regional information; Module 2 summaries; Module 3 quality; Module 4 nonclinical; Module 5 clinical.","CTD is the harmonized dossier structure; eCTD is an electronic format for submitting and managing that information.","CMC means Chemistry, Manufacturing, and Controls.","ICH guidelines harmonize technical requirements for pharmaceutical development and registration."][i]}</p></details>`).join("")}</div></div>`}
function renderGlossary(){document.getElementById("view").innerHTML=`<div class="sectionhead"><div><h2>Pharmaceutical Glossary</h2><p>Search common PV and RA abbreviations and definitions.</p></div></div><input class="search" id="glossSearch" placeholder="Search abbreviation or meaning..." oninput="filterGlossary()"><div id="glossList" style="margin-top:14px">${glossary.map(g=>`<div class="card" style="padding:13px;margin-bottom:8px" data-g="${g.join(" ").toLowerCase()}"><b style="color:var(--blue)">${g[0]}</b> — <b>${g[1]}</b><div style="font-size:13px;color:var(--muted)">${g[2]}</div></div>`).join("")}</div>`}
function filterGlossary(){let q=document.getElementById("glossSearch").value.toLowerCase();document.querySelectorAll("[data-g]").forEach(x=>x.classList.toggle("hidden",!x.dataset.g.includes(q)))}
function renderProgress(){let n=completed.length;document.getElementById("view").innerHTML=`<div class="sectionhead"><div><h2>Your learning progress</h2><p>Your completed lessons are saved in this browser on this device.</p></div></div><div class="panel"><h3>${n} of 38 lessons completed</h3><div class="progress"><i style="width:${n/38*100}%"></i></div><p>${Math.round(n/38*100)}% overall completion</p><div class="coursefoot"><span>PV: ${completed.filter(x=>x.startsWith("pv")).length}/18</span><span>RA: ${completed.filter(x=>x.startsWith("ra")).length}/20</span></div></div><div class="note">Progress is stored locally in this browser. It does not sync between devices or create a user account.</div>`}
function toggleTheme(){document.body.classList.toggle("darkmode");if(document.body.classList.contains("darkmode")){document.documentElement.style.setProperty("--bg","#101a2d");document.documentElement.style.setProperty("--panel","#182642");document.documentElement.style.setProperty("--ink","#edf3ff");document.documentElement.style.setProperty("--muted","#aab8d0");document.documentElement.style.setProperty("--line","#2b3b5b")}else{["--bg","--panel","--ink","--muted","--line"].forEach((x,i)=>document.documentElement.style.removeProperty(x))}}
</script>
</body></html>
